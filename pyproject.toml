[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dig-ai-fte"
version = "0.1.0"
description = "Digital AI Full-Time Employee - Autonomous Agent for Personal and Business Automation"
authors = [{name = "AI Employee", email = "ai-employee@example.com"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "watchdog>=4.0.0",
    "playwright>=1.40.0",
    "google-api-python-client>=2.108.0",
    "google-auth-oauthlib>=1.1.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "loguru>=0.7.0",
    "datamodel-code-generator>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
